<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="format-detection" content="telephone=no">
<title>TuttoFit</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TuttoFit">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna (máx. 560px). Identidad deportiva: naranja intenso, negro, grafito y blanco; titulares condensados en cursiva, rayas inclinadas, cuadrícula de puntos y regla de tiempo. */
:root{
  --bg:#F1F0EC; --surface:#FFFFFF; --ink:#0A0A0A; --muted:#5E5E5A; --line:#D9D8D3; --soft:#EAE9E4;
  --accent:#EA5129; --accent-ink:#0A0A0A; --accent-t:#C23E12;
  --run:#C23E12; --run-bg:#FCE4DA; --tkd:#FFFFFF; --tkd-bg:#0A0A0A; --str:#FFFFFF; --str-bg:#2A2A2A; --hip:#FFFFFF; --hip-bg:#27406B; --opt:#4A4A47; --opt-bg:#E4E3DE;
  --d-run:#EA5129; --d-tkd:#0A0A0A; --d-str:#2A2A2A; --d-hip:#27406B;
  --ok:#17803F; --warn:#B26A00; --bad:#C2321A;
  --f-display:"Barlow Condensed","Barlow Semi Condensed",system-ui,sans-serif; --f-body:"Barlow Semi Condensed",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0A0A; --surface:#171717; --ink:#F5F4F0; --muted:#A09F99; --line:#2C2C2A; --soft:#222221;
  --accent:#FF5B2E; --accent-ink:#0A0A0A; --accent-t:#FF7A52;
  --run:#FF7A52; --run-bg:#3A1C12; --tkd:#0A0A0A; --tkd-bg:#F5F4F0; --str:#FF7A52; --str-bg:#2C2C2A; --hip:#8FB4FF; --hip-bg:#1B2A47; --opt:#A09F99; --opt-bg:#222221;
  --d-run:#FF5B2E; --d-tkd:#F5F4F0; --d-str:#6B6B66; --d-hip:#5B86E0;
  --ok:#52C98B; --warn:#F0B35A; --bad:#FF7A6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#171717; --ink:#F5F4F0; --muted:#A09F99; --line:#2C2C2A; --soft:#222221;
  --accent:#FF5B2E; --accent-ink:#0A0A0A; --accent-t:#FF7A52;
  --run:#FF7A52; --run-bg:#3A1C12; --tkd:#0A0A0A; --tkd-bg:#F5F4F0; --str:#FF7A52; --str-bg:#2C2C2A; --hip:#8FB4FF; --hip-bg:#1B2A47; --opt:#A09F99; --opt-bg:#222221;
  --d-run:#FF5B2E; --d-tkd:#F5F4F0; --d-str:#6B6B66; --d-hip:#5B86E0;
  --ok:#52C98B; --warn:#F0B35A; --bad:#FF7A6B; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 100px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.05}
h1,h2{font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.005em}
h1{font-size:34px} h2{font-size:26px}
h3{font-family:var(--f-body);font-size:16px;font-weight:700;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .num{font-variant-numeric:tabular-nums}
.label{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-t)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.sect{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;min-width:0} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}

/* marca */
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0A0A0A;border-radius:6px;padding:10px 14px;overflow:hidden;position:relative}
.brand b{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:30px;letter-spacing:.04em;color:#EA5129;line-height:1;white-space:nowrap}
.brand span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#F5F4F0;text-align:right}
.stripes{background-image:repeating-linear-gradient(105deg,rgba(0,0,0,.10) 0 26px,transparent 26px 60px)}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px 16px;align-items:center;border:0;color:#0A0A0A;position:relative;overflow:hidden;
  background:radial-gradient(rgba(0,0,0,.22) 1px,transparent 1.3px) 0 0/14px 14px,repeating-linear-gradient(105deg,rgba(0,0,0,.09) 0 26px,transparent 26px 60px),#EA5129}
.hero .label{color:rgba(0,0,0,.72)}
.hero .big{font-family:var(--f-display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:34px;line-height:.98;letter-spacing:.005em}
.hero .sub{font-size:14px;font-weight:600;color:rgba(0,0,0,.78)}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:rgba(0,0,0,.22)} .ring .fg{stroke:#0A0A0A}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:28px;line-height:1}
.ring b small{font:700 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;font-style:normal;opacity:.8;margin-top:2px}
.card:not(.hero) .ring .bg{stroke:var(--soft)} .card:not(.hero) .ring .fg{stroke:var(--accent)} .card:not(.hero) .ring b{color:var(--ink)}
.hero-foot{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:3px;background:#0A0A0A;color:#F5F4F0;white-space:nowrap}
.ruler{grid-column:1/-1;position:relative;height:22px;border-bottom:2px solid #0A0A0A;
  background:linear-gradient(90deg,#0A0A0A 1.5px,transparent 0) left bottom/calc(100%/52) 8px repeat-x}
.ruler i{position:absolute;bottom:-2px;left:var(--p);width:4px;height:22px;background:#0A0A0A;transform:skewX(-14deg)}
.ruler em{position:absolute;top:-2px;left:var(--p);font:800 11px var(--f-display);font-style:italic;letter-spacing:.06em;margin-left:8px;background:#0A0A0A;color:#EA5129;padding:0 5px;border-radius:2px}

/* tira semanal */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sp{border:1.5px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.sp svg{width:20px;height:20px}
.sp.sel{border-color:var(--accent);background:var(--accent);color:#0A0A0A}
.sp .chk{width:14px;height:14px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--surface)}
.sp.done .chk{background:var(--ok)} .sp.sel .chk{background:rgba(0,0,0,.25)} .sp.sel.done .chk{background:#0A0A0A;color:#EA5129}
.sp.run,.sp.tkd,.sp.str,.sp.hip{color:var(--ink)} .sp.run svg{color:var(--run)} .sp.hip svg{color:var(--d-hip)} .sp.opt,.sp.rest{color:var(--opt)}
.sp.sel svg{color:#0A0A0A}

/* sesión */
.sess{padding:0;overflow:hidden}
.band{padding:16px;display:flex;gap:14px;align-items:center;background-color:var(--kc);color:var(--kt);
  background-image:repeating-linear-gradient(105deg,rgba(0,0,0,.10) 0 26px,transparent 26px 60px);border-bottom:3px solid #0A0A0A}
.band.run{--kc:#EA5129;--kt:#0A0A0A;--bi:rgba(0,0,0,.16)} .band.tkd{--kc:#F5F4F0;--kt:#0A0A0A;--bi:rgba(0,0,0,.10)}
.band.str{--kc:#222222;--kt:#F5F4F0;--bi:rgba(255,91,46,.2)} .band.hip{--kc:#27406B;--kt:#FFFFFF;--bi:rgba(255,255,255,.14)}
.band.opt{--kc:#3A3A38;--kt:#F5F4F0;--bi:rgba(255,255,255,.12)} .band.rest{--kc:#1B1B1A;--kt:#F5F4F0;--bi:rgba(255,255,255,.1)}
.band .ic{width:56px;height:56px;border-radius:4px;background:var(--bi);display:flex;align-items:center;justify-content:center;flex:none;transform:skewX(-8deg)}
.band .ic svg{width:32px;height:32px;transform:skewX(8deg)}
.band.str .ic svg{color:#FF5B2E}
.band h2{color:var(--kt);font-size:27px}
.band .label{color:var(--kt)!important;opacity:.75}
.band .d{font-size:13.5px;font-weight:600;opacity:.8}
.sess .body{padding:16px;display:flex;flex-direction:column;gap:14px}
.kv{display:flex;gap:8px;flex-wrap:wrap}
.kv>div{background:var(--bg);border-left:3px solid var(--accent);border-radius:2px;padding:8px 12px;min-width:88px}
.kv b{display:block;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:26px;line-height:1.05}
.segs{display:flex;gap:3px;height:16px;transform:skewX(-14deg)}
.segs i{display:block;min-width:6px}
.s0{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--muted)} .s1{background:var(--accent)} .s2{background:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.steps li{padding-left:18px;position:relative}
.steps li::before{content:"";position:absolute;left:2px;top:.55em;width:7px;height:7px;background:var(--accent);transform:skewX(-14deg)}
.note{background:var(--soft);border-left:3px solid var(--accent);border-radius:2px;padding:10px 12px;font-size:14.5px}
details.note summary{cursor:pointer;list-style:none} details.note summary::-webkit-details-marker{display:none}
details.note summary::after{content:" ▾";color:var(--muted)}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:3px;white-space:nowrap}
.tag.run{background:var(--run-bg);color:var(--run)} .tag.tkd{background:var(--tkd-bg);color:var(--tkd)} .tag.str{background:var(--str-bg);color:var(--str)}
.tag.hip{background:var(--hip-bg);color:var(--hip)} .tag.opt,.tag.rest{background:var(--opt-bg);color:var(--opt)}
.tag.ok{background:var(--soft);color:var(--ok)} .tag.warn{background:var(--soft);color:var(--warn)} .tag.bad{background:var(--soft);color:var(--bad)}
.dot{width:10px;height:10px;border-radius:2px;flex:none;background:var(--opt);transform:skewX(-14deg)}
.dot.run{background:var(--d-run)} .dot.tkd{background:var(--d-tkd)} .dot.str{background:var(--d-str)} .dot.hip{background:var(--d-hip)}

/* ejercicios */
.tile{position:relative;aspect-ratio:16/9;background:#0A0A0A;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile iframe,.tile .yt{position:absolute;inset:0;width:100%;height:100%;border:0} .tile .yt>div,.tile .yt iframe{width:100%;height:100%}
.tile .vf{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;color:#fff;text-decoration:none;cursor:pointer}
.tile .vf::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.tile .pb{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;background:#EA5129;color:#0A0A0A;display:flex;align-items:center;justify-content:center;font-size:22px;padding-left:4px}
.tile .nov{flex-direction:column;gap:10px;background:#171717}
.tile .nov::after{display:none}
.tile .vt{position:relative;z-index:1;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#F5F4F0}
.tile .fig{position:absolute;right:8px;top:8px;width:36px;opacity:.9;pointer-events:none;z-index:2}
.tile .fig .sil{fill:rgba(255,255,255,.16);stroke:rgba(255,255,255,.4)} .tile .fig .z{fill:#EA5129}
.logbox{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.logbox.ok{border-color:var(--ok)}
.chip2{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;min-height:36px}
.chip2.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .chip2.warnc.on{background:var(--bad);border-color:var(--bad);color:#fff}
.feel{gap:6px}
details.movebox{border:1px dashed var(--line);border-radius:6px;padding:10px 12px} details.movebox summary{cursor:pointer;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
details.movebox[open]{display:flex;flex-direction:column;gap:8px}
.blk{display:flex;flex-direction:column;gap:12px}
.ex{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.blk .ex:first-of-type{border-top:0;padding-top:0}
.fig{width:62px;height:auto;display:block}
.fig .sil{fill:var(--soft);stroke:var(--line);stroke-width:1}
.fig .z{fill:var(--accent);opacity:.95}
.ex .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{width:44px;height:44px;border-radius:4px;border:1.5px solid var(--line);background:var(--bg);font-family:var(--f-display);font-style:italic;font-weight:800;font-size:20px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kg{width:84px;min-height:40px;padding:6px 10px;text-align:center}
.vid{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}

.btn{border:1.5px solid var(--ink);background:transparent;border-radius:4px;padding:10px 14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:12.5px} .btn.danger{color:var(--bad);border-color:var(--bad)}
.fields{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 110px} .field span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
input[type=number],input[type=text],input[type=date],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:4px;padding:9px 11px;min-height:44px}
textarea{min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace}
input[type=file]{width:100%;font-size:14px}

/* entrenador */
.coach{display:flex;flex-direction:column;gap:10px}
.coach .hd{display:flex;gap:10px;align-items:center}
.coach .ico{width:38px;height:38px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--soft);color:var(--ok);transform:skewX(-8deg)}
.coach.warn .ico{color:var(--warn)} .coach.bad .ico{color:var(--bad)} .coach.up .ico{background:var(--accent);color:#0A0A0A}
.coach svg{width:20px;height:20px;transform:skewX(8deg)}
.pend{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px}

/* listas */
.dayhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-height:62px}
.dayhead.today{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.dayhead .dn{width:44px;flex:none} .dayhead .dn b{display:block;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
.dayhead .ic{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex:none}
.dayhead .ic svg{width:20px;height:20px}
.ic.run{background:var(--run-bg);color:var(--run)} .ic.tkd{background:var(--tkd-bg);color:var(--tkd)} .ic.str{background:var(--str-bg);color:var(--str)} .ic.hip{background:var(--hip-bg);color:var(--hip)} .ic.opt,.ic.rest{background:var(--opt-bg);color:var(--opt)}
.day{display:flex;flex-direction:column;gap:8px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav button{width:44px;height:44px;border-radius:4px;border:1.5px solid var(--ink);background:transparent;font-size:18px}
.heat{display:flex;flex-direction:column;gap:10px}
.hrow{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center}
.hrow .cells{display:flex;flex-wrap:wrap;gap:4px}
.cell{width:23px;height:23px;border-radius:3px;background:var(--soft);border:0;padding:0;font-size:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center}
.cell.cut{border:1.5px dashed var(--muted)} .cell.full{background:var(--accent);color:#0A0A0A} .cell.part{background:color-mix(in srgb,var(--accent) 40%,var(--soft))}
.cell.miss{background:var(--soft);color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad)} .cell.now{outline:2px solid var(--ink);outline-offset:1px}
details.ph{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
details.ph>summary{cursor:pointer;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:20px;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.ph>summary::-webkit-details-marker{display:none}
.wk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:52px;margin-top:8px}
.wk.now{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.lbar{height:8px;background:var(--soft);width:70px;flex:none;overflow:hidden;transform:skewX(-14deg)} .lbar>i{display:block;height:100%;background:var(--accent)}

/* gráficas */
svg.chart{width:100%;height:auto;display:block}
svg .t{fill:var(--muted);font:10px var(--f-body);font-weight:600} svg .grid{stroke:var(--line);stroke-width:1}
svg .band2{fill:var(--bg)} svg .plan{fill:var(--soft)} svg .real{fill:var(--accent)}
svg .area{fill:var(--accent);opacity:.16} svg .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
svg .ln2{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round} svg .pt{fill:var(--accent)} svg .mk{fill:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mini .v{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:32px;line-height:1}
.delta{font-size:12.5px;font-weight:700}
.src{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.src:first-of-type{border-top:0;padding-top:0}

.tabs{position:fixed;left:0;right:0;bottom:0;background:#0A0A0A;border-top:3px solid #EA5129;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center;z-index:20}
.tabs>div{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:48px;color:#A09F99;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

async function unlockData(pw){
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.replace(/[\s-]/g,'').toUpperCase()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(ENC.s),iterations:ENC.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(ENC.i)},key,b(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt))}

/* ============ sesiones ============ */
const warmDyn='Antes: 5 min de movilidad dinámica (balanceos de pierna, zancadas caminando, círculos de cadera y de tobillo).';
function midSession(w,L){
  const km=midKm(w,L),ph=phaseOf(w).id,cut=isCut(w);
  const easy=`Ritmo cómodo ${P.easy()} · RPE 3–4, pulso en tu zona 2 (125–154 lpm según Strava). Si puedes hablar sin esfuerzo, vas bien.`;
  if(w===52)return{title:'Rodaje de activación',km,steps:[easy,'4 progresivos de 20 s al final, con 1 min de marcha entre ellos'],segs:[['Suave',20,0],['Progresivos',2,1]],tip:'Piernas frescas. Prepara la ropa y el dorsal.'};
  if(cut)return{title:'Rodaje suave',km,steps:[easy],segs:[['Suave',1,0]],tip:'Semana de descarga. Mantén el esfuerzo bajo.'};
  if(ph==='base')return{title:w>=3?'Rodaje suave + progresivos':'Rodaje suave',km,
    steps:[easy,w<=2?'Si lo necesitas, alterna 4 min corriendo y 1 min andando':'4 progresivos de 20 s al final, con 1 min de marcha entre ellos'],segs:w>=3?[['Suave',9,0],['Progresivos',1,1]]:[['Suave',1,0]],tip:'Aquí se gana base. Correr lento es parte del plan.'};
  if(ph==='build'){
    if(w%2===1){const T=Math.min(30,10+Math.round((w-13)*1.4));
      return{title:`Tempo ${T} min`,km,steps:['10 min de calentamiento suave',`${T} min a ritmo tempo ${P.tempo()} · RPE 6–7`,'10 min de enfriamiento suave'],segs:[['Calentar',10,0],['Tempo '+T+' min',T,1],['Enfriar',10,0]],tip:'Esfuerzo duro pero controlado: frases cortas, no palabras sueltas.'}}
    const R=4+Math.floor((w-14)/4);
    return{title:`Intervalos ${R} × 800 m`,km,steps:['12 min de calentamiento + 4 progresivos',`${R} × 800 m a ${P.i5()} · RPE 8, con 2 min de trote entre series`,'10 min de enfriamiento suave'],segs:[['Calentar',14,0],[R+' × 800 m',R*5,2],['Enfriar',10,0]],tip:'Si llegas cansado del taekwondo del martes, baja una serie.'}}
  if(ph==='spec'){const X=Math.min(10,4+Math.round((w-29)*.4));
    return{title:`Ritmo maratón ${X} km`,km,steps:['15 min de calentamiento suave',`${X} km a ritmo maratón ${P.mp()} · RPE 6`,'10 min de enfriamiento suave'],segs:[['Calentar',15,0],['Ritmo maratón '+X+' km',X*6.5,1],['Enfriar',10,0]],tip:'Aprende cómo se siente el ritmo de carrera. Debe parecer sostenible.'}}
  if(w>=49)return{title:'Rodaje suave + progresivos',km,steps:[easy,'4 progresivos de 20 s al final'],segs:[['Suave',9,0],['Progresivos',1,1]],tip:'Reduce volumen y mantén la chispa.'};
  return{title:'Tempo corto',km,steps:['10 min de calentamiento suave',`15 min a ritmo tempo ${P.tempo()} · RPE 6`,'10 min de enfriamiento suave'],segs:[['Calentar',10,0],['Tempo 15 min',15,1],['Enfriar',10,0]],tip:'Mantén la intensidad con menos volumen.'};
}
function longSession(w,L){
  const ph=phaseOf(w).id,cut=isCut(w);
  if(w===52)return{title:'MARATÓN',km:42.195,race:1,segs:[['42,2 km',1,0]],steps:['Sal 5–10 s/km más lento de lo previsto durante los primeros 10 km',`Ritmo objetivo ${P.mp()} para llegar a ${S.goal}`,'Toma 30–60 g de hidratos por hora, como en los entrenos','Termina fuerte si te quedan fuerzas'],tip:'Has hecho el trabajo. Disfruta la carrera.'};
  const steps=[`Ritmo muy cómodo ${P.easy()} · RPE 3–4`];let M=0;
  if(L>=14)steps.push('Practica la nutrición: 30–60 g de hidratos por hora y agua cada 20 min');
  if(L>=16&&!cut)steps.push('Usa las zapatillas y la ropa de carrera');
  if(w>=33&&!cut&&w%2===1&&w<49){M=Math.min(10,Math.round(L*.25));steps.push(`Últimos ${M} km a ritmo maratón ${P.mp()}`)}
  else if(ph==='build'&&!cut&&w%2===1)steps.push('Últimos 10–15 min algo más vivos, RPE 5');
  if(w===26)steps.push('Simulacro de media maratón: 21 km. Es una buena referencia para ajustar el objetivo');
  if(L<12)steps.push('Si lo necesitas, camina 1 min cada 15 min');
  return{title:cut?'Tirada larga de descarga':'Tirada larga',km:L,steps,segs:M?[['Suave',L-M,0],['Ritmo maratón '+M+' km',M,1]]:[['Suave',1,0]],tip:cut?'Semana de descarga: menos kilómetros para absorber la carga.':'La sesión clave de la semana. Termina con la sensación de poder seguir.'};
}
function session(w,d){
  const L=longKm(w),cut=isCut(w);
  if(d===0){
    if(w===52)return{kind:'opt',title:'Movilidad suave',dur:'15 min',steps:['Movilidad de cadera, tobillos y columna torácica','Sin fuerza esta semana: llega fresco']};
    return{kind:'str',title:'Fuerza de espalda y escápulas',dur:'45–55 min',variant:w%2?'A':'B',cut,
      tip:(cut?'Semana de descarga: una serie menos por ejercicio. Repite la prueba de la pared y compárala con la anterior. ':'')+'Primero abre el pecho y activa el serrato, después fortalece la espalda alta. En los remos junta las escápulas sin encoger los trapecios. Termina cada serie con 2 repeticiones en reserva. Si notas dolor agudo, para y consulta a un fisioterapeuta.'};}
  if(d===1)return{kind:'tkd',title:'Taekwondo · clase guiada',dur:'60 min',
    steps:['Antes de la clase: 3–5 min de círculos de cadera y balanceos de pierna. Evita estiramientos estáticos largos justo antes de patear','Anota el esfuerzo percibido al terminar',w===52?'Esta semana solo técnica suave, sin contacto ni saltos exigentes':'El jueves toca calidad: si llegas muy cargado, cámbiala por un rodaje suave'],
    tip:'Cuenta como entrenamiento de piernas, coordinación y cardio, y es tu mejor práctica de movilidad de cadera en movimiento.'};
  if(d===2){
    if(w===52)return{kind:'opt',title:'Movilidad suave de cadera',dur:'15 min',steps:['Círculos de cadera, 90/90 y rana, sin forzar','Descansa pronto']};
    return{kind:'hip',title:'Cadera: movilidad y fuerza',dur:'30–40 min',cut,
      tip:(cut?'Semana de descarga: una serie menos. ':'')+'Mantén las posturas 30–60 s, hasta una tensión suave sin dolor. Las series de fuerza, con 2–3 repeticiones en reserva: mañana hay calidad de carrera dentro de 24 h y no conviene llegar a fallo.'};}
  if(d===3){const m=midSession(w,L);m.steps=[warmDyn].concat(m.steps);return Object.assign({kind:'run'},m)}
  if(d===5&&w<50)return{kind:'opt',title:'Opcional · Caminata suave',dur:'45–60 min',steps:['Paseo a paso vivo, puedes hablar sin esfuerzo','Suma gasto calórico sin impacto: ayuda a bajar peso sin cargar las piernas antes de la tirada larga'],tip:'Si estás cansado, descansa: la tirada larga de mañana es más importante.'};
  if(d===4&&w<51&&w!==52){const km=isCut(w)?5:Math.max(5,Math.min(10,Math.round(longKm(w)*.45)));return{kind:'opt',orun:1,title:'Opcional · Rodaje suave',km,steps:[warmDyn,`Ritmo cómodo ${P.easy()} · zona 2 de pulso (125–154 lpm). Debes poder hablar.`,'Si el domingo toca tirada larga y te notas cargado, sáltalo o cámbialo por remo suave'],tip:'Tercer rodaje para sumar kilómetros fáciles. Es el que más ayuda a ganar fondo y a bajar de peso sin cargar las piernas.'}}
  if(d===4||d===5)return{kind:'rest',title:d===5&&w===52?'Descanso antes de la carrera':'Descanso',steps:['Camina, estírate y duerme bien'],tip:d===5&&w>=50?'Hidrátate y come bien los hidratos.':''};
  const l=longSession(w,L);l.steps=[warmDyn].concat(l.steps);return Object.assign({kind:'run',long:1},l);
}

function ring(p,txt,sub){const r=40,c=2*Math.PI*r;return `<div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="${r}" fill="none" stroke-width="9"/><circle class="fg" cx="50" cy="50" r="${r}" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-Math.min(1,p))).toFixed(1)}"/></svg><b>${txt}<small>${sub}</small></b></div>`}
function segBar(segs){if(!segs||segs.length<2)return '';

function lineChart(pts,o){o=o||{};const W=300,H=72,p=7;if(!pts||pts.length<2)return '<div class="small muted">Sin datos suficientes</div>';
  const ys=pts.map(a=>a[1]);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx===mn){mx+=1;mn-=1}
  const X=i=>p+i/(pts.length-1)*(W-2*p),Y=v=>H-p-(v-mn)/(mx-mn)*(H-2*p);
  const d=pts.map((a,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(a[1]).toFixed(1)).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||'Tendencia'}"><path class="area" d="${d}L${X(pts.length-1).toFixed(1)} ${H-p}L${p} ${H-p}Z"/><path class="ln" d="${d}"/><circle class="pt" cx="${X(pts.length-1).toFixed(1)}" cy="${Y(ys[ys.length-1]).toFixed(1)}" r="3.5"/></svg>`}
function barChart(vals,labels){const W=300,H=72,p=6,n=vals.length,mx=Math.max(1,...vals),bw=(W-2*p)/n;
  return `<svg class="chart" viewBox="0 0 ${W} ${H+14}" role="img" aria-label="Kilómetros por mes">${vals.map((v,i)=>{const h=(v/mx)*(H-12);return `<rect class="real" x="${(p+i*bw+2).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${h.toFixed(1)}" rx="3"/>`}).join('')}${labels.map((l,i)=>i%2===0?`<text class="t" x="${(p+i*bw+bw/2).toFixed(1)}" y="${H+11}" text-anchor="middle">${l}</text>`:'').join('')}</svg>`}

/* ============ datos importados ============ */
function monthKey(d){return d.slice(0,7)}
function monthly(rows,val){const m={};rows.forEach(r=>{(m[monthKey(r[0])]=m[monthKey(r[0])]||[]).push(val(r))});return m}
const med=a=>{a=a.slice().sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:0};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function lastN(arr,n){return arr.slice(-n)}
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!=='\r')f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
function localDate(s,off){const m=/^([+-])(\d\d):(\d\d)$/.exec(off||'+00:00')||[0,'+','00','00'];const t=new Date(s).getTime()+(m[1]==='-'?-1:1)*(+m[2]*60+ +m[3])*6e4;return new Date(t).toISOString().slice(0,10)}
function mergeSeries(old,nw){const m=new Map((old||[]).map(a=>[a[0],a]));(nw||[]).forEach(a=>m.set(a[0],a));return [...m.values()].sort((a,b)=>a[0]<b[0]?-1:1)}
async function importFiles(files){
  const imp=JSON.parse(JSON.stringify(IMP()));let got=[];
  for(const f of files){
    if(/\.json$/i.test(f.name)){try{const o=JSON.parse(await f.text());if(o.kind!=='plan-maraton-historial')throw 0;S.imp=o.imp;if(o.cfg){S.start=o.cfg.start;S.startKm=o.cfg.startKm;S.hist=o.cfg.hist||0;S.mig=o.cfg.start}const n=autoLog();save();toast('Historial importado'+(n?` · ${n} sesiones registradas`:''));return render()}catch(x){return toast('Ese archivo no es un historial válido')}}
    const rows=parseCSV(await f.text());if(rows.length<2)continue;const h=rows[0].map(x=>x.trim()),ix=n=>h.indexOf(n),body=rows.slice(1).filter(r=>r.length>1);
    if(ix('exercise_start')>=0){const a=ix('activity_name'),s=ix('exercise_start'),e=ix('exercise_end'),o=ix('utc_offset'),dm=ix('tracker_total_distance_mm'),hr=ix('tracker_avg_heart_rate');const runs=[],oth=[];
      body.forEach(r=>{const n=r[a],d=localDate(r[s],r[o]),mins=Math.round((new Date(r[e])-new Date(r[s]))/6e4);
        if(n==='Outdoor Run'||n==='Run'||n==='Treadmill'){const km=(+r[dm]||0)/1e6;if(km>0.5)runs.push([d,+km.toFixed(2),mins,Math.round(+r[hr]||0)])}
        else if(n==='Taekwondo'||n==='Martial Arts')oth.push([d,'tkd',mins]);else if(n==='Strength training'||n==='Powerlifting')oth.push([d,'str',mins]);else if(n==='Rowing machine')oth.push([d,'row',mins])});
      imp.runs=mergeSeries(imp.runs,runs);imp.oth=mergeSeries(imp.oth.map(x=>[x[0]+x[1],...x]),oth.map(x=>[x[0]+x[1],...x])).map(x=>x.slice(1));got.push('ejercicios ('+runs.length+' carreras)')}
    else{const col=(name,k,scale,every)=>{const c=ix(name);if(c<0)return false;const out=body.map(r=>[r[0].slice(0,10),+(parseFloat(r[c])*scale).toFixed(1)]).filter(x=>!isNaN(x[1]));imp[k]=mergeSeries(imp[k],every>1?out.filter((_,i)=>i%every===0):out);got.push(k);return true};
      col('beats per minute','rhr',1,1)||col('daily vo2 max value','vo2',1,3)||col('average heart rate variability milliseconds','hrv',1,3)||col('weight grams','wt',.001,1)}

function autoLog(src){let n=0;const st=startU(),imp=IMP(),byW={},oW={};
  const wOf=d=>{const diff=Math.floor((utc(d)-st)/MS);return diff<0?0:Math.floor(diff/7)+1};
  const dow=d=>(new Date(utc(d)).getUTCDay()+6)%7;
  imp.runs.forEach(r=>{const w=wOf(r[0]);if(w>=1&&w<=52&&r[1]>=1)(byW[w]=byW[w]||[]).push(r)});
  imp.oth.forEach(r=>{const w=wOf(r[0]);if(w>=1&&w<=52)(oW[w]=oW[w]||[]).push(r)});
  const put=(k,rec)=>{if(!S.done[k]){S.done[k]=Object.assign({t:Date.now(),rpe:null,note:'',src:src||'gh'},rec);delete S.skip[k];n++;return 1}return 0};
  Object.keys(byW).forEach(w=>{const a=byW[w].sort((x,y)=>y[1]-x[1]),used={};
    a.forEach(r=>{const dw=dow(r[0]),slots=[3,6].concat(session(+w,4).orun?[4]:[]).filter(x=>!used[x]).sort((x,y)=>Math.abs(dw-dayOfSlot(+w,x))-Math.abs(dw-dayOfSlot(+w,y))),slot=slots[0]||0;
      if(slot&&put(w+'.'+slot,{km:r[1],min:r[2],hr:r[3]||null}))used[slot]=1;else if(slot)used[slot]=1})});
  Object.keys(oW).forEach(w=>oW[w].forEach(r=>{if(r[1]==='tkd')put(w+'.1',{km:null,min:r[2]});if(r[1]==='str')put(w+'.0',{km:null,min:r[2]})}));
  return n}

/* ============ sincronización con Strava ============ */
function mergeRuns(old,nw){const m=new Map();(old||[]).forEach(r=>m.set(r[0]+'|'+(+r[1]).toFixed(1),r));(nw||[]).forEach(r=>m.set(r[0]+'|'+(+r[1]).toFixed(1),r));return [...m.values()].sort((a,b)=>a[0]<b[0]?-1:1)}
let syncing=false;
async function syncStrava(manual){
  if(!S.syncUrl){if(manual)toast('Configura antes la conexión en Más → Strava');return}
  if(syncing)return;syncing=true;if(manual)toast('Sincronizando con Strava…');
  try{const after=Math.floor((utc(S.start)-14*MS)/1000);
    const r=await fetch(S.syncUrl.replace(/\/$/,'')+'/activities?after='+after,{headers:{'X-Key':S.syncKey||''},cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);const list=await r.json();
    const imp=JSON.parse(JSON.stringify(IMP())),runs=[],oth=[],dw=d=>(new Date(utc(d)).getUTCDay()+6)%7;
    list.forEach(a=>{const d=String(a.date).slice(0,10),min=Math.round(a.min||0),ty=String(a.type||'');
      if(/Run/.test(ty)&&a.km>=0.5)runs.push([d,Math.round(a.km*100)/100,min,Math.round(a.hr||0)]);
      else if(/WeightTraining/.test(ty))oth.push([d,'str',min]);else if(/Rowing/.test(ty))oth.push([d,'row',min]);
      else if(/taekwondo/i.test(a.name||'')||(ty==='Workout'&&min>=40&&dw(d)===1))oth.push([d,'tkd',min])});
    imp.runs=mergeRuns(imp.runs,runs);imp.oth=mergeSeries((imp.oth||[]).map(x=>[x[0]+x[1],...x]),oth.map(x=>[x[0]+x[1],...x])).map(x=>x.slice(1));
    imp.at=iso(todayU());imp.src='Strava';S.imp=imp;
    const n=autoLog('strava');S.lastSync=Date.now();save();render();if(manual)toast(n?`Strava: ${n} sesiones nuevas registradas`:'Strava al día');
  }catch(e){if(manual)toast('No pude conectar con Strava. Revisa la dirección y la clave')}finally{syncing=false}}

/* ============ entrenador adaptativo ============ */
function pendings(){const c=cur();if(c.st==='before')return[];const out=[],t=todayU(),w0=Math.max(1,c.w-1);
  for(let w=w0;w<=c.w;w++)for(const d of coreDays(w)){const k=w+'.'+d;if(!(S.hist&&w<=S.hist)&&dateSlot(w,d)<t&&!S.done[k]&&!S.skip[k]&&session(w,d).kind!=='rest')out.push([w,d])}
  return out.slice(-3)}
function coach(){
  const c=cur();if(c.st!=='on'||c.w<2)return{lvl:'none',title:'Aún sin datos para adaptar',lines:['Todavía no hay semanas completas para evaluar. Registra tus sesiones y empezaré a adaptar el plan a partir de la semana 2.']};
  const w=c.w,m=multOf(w+1);let planned=0,done=0,rp=[],pain=false;
  for(let x=Math.max(1,w-2);x<=w;x++)for(const d of coreDays(x)){
    const past=x<w||dateSlot(x,d)<todayU();if(!past)continue;planned++;const r=S.done[x+'.'+d];
    if(r){done++;if(r.rpe&&(d===3||d===6))rp.push(r.rpe);if(/dolor|molest|lesi|pincha|tir[oó]n|sobrecarga/i.test(r.note||''))pain=true}}
  if(!planned)return{lvl:'none',title:'Entrenador',lines:['Sin sesiones pasadas que evaluar.']};
  const adh=done/planned,avgR=rp.length?mean(rp):null,rhr=IMP().rhr;let fat=false,fl='';
  if(rhr.length>=20&&utc(rhr[rhr.length-1][0])>=todayU()-12*MS){const a=mean(rhr.slice(-7).map(x=>x[1])),b=mean(rhr.slice(-35,-7).map(x=>x[1]));if(a-b>=4){fat=true;fl=`Tu pulso en reposo de la última semana (${a.toFixed(0)} lpm) está ${ (a-b).toFixed(0)} lpm por encima de tu media de las 4 semanas previas.`}}
  const lines=[`Cumplimiento de las últimas semanas: ${Math.round(adh*100)} % (${done} de ${planned} sesiones).`];
  if(avgR!==null)lines.push(`Esfuerzo medio en carrera: ${avgR.toFixed(1)} sobre 10.`);
  let lvl='ok',title='Vas en línea con el plan',nm=m;const nextCut=isCut(w+1)||w+1>=44;
  if(pain){lvl='bad';title='Anotaste molestias: descarga y revisión';nm=Math.max(.8,m-.1);lines.push('Has escrito una molestia o dolor en las notas. Baja la carga y consulta a un fisioterapeuta si dura más de unos días.')}
  else if(fat||(avgR!==null&&avgR>=8)){lvl='warn';title='Señales de fatiga: baja un poco';nm=Math.max(.8,m-.05);if(fat)lines.push(fl);if(avgR>=8)lines.push('Tus rodajes te cuestan demasiado. Deben sentirse suaves.')}
  else if(adh<.5){lvl='bad';title='Has faltado a muchas sesiones';nm=Math.max(.8,m-.1);lines.push('Vuelvo a cargas más bajas para que retomes sin lesionarte.')}
  else if(adh<.75){lvl='warn';title='Cumplimiento medio: sin subir carga';nm=Math.max(.8,m-.05);lines.push('Reduzco un poco el volumen hasta que recuperes la regularidad.')}
  else if(adh>=.85&&(avgR===null||avgR<=5.5)&&!nextCut&&m<1.1){lvl='up';title='Progresas muy bien: subo un 5 %';nm=Math.min(1.1,m+.05);lines.push('Cumples y los esfuerzos son bajos, así que puedes tolerar algo más de volumen.')}
  nm=Math.round(nm*100)/100;
  return{lvl,title,lines,nm,from:w+1,change:nm!==m,applied:S.coachDone[w]===1,preview:nm!==m?`Tirada larga de la semana ${w+1}: ${Math.min(32,Math.round(baseLong(w+1)*m))} → ${Math.min(32,Math.round(baseLong(w+1)*nm))} km`:''}}

function weekStats(w){let p=0,d=0;coreDays(w).forEach(x=>{if(session(w,x).kind!=='rest'&&session(w,x).kind!=='opt'){p++;if(S.done[w+'.'+x])d++}});return{p,d}}

 {t:'Frecuencia de fuerza y cardio',v:'ok',c:'La OMS recomienda en adultos 150–300 min semanales de actividad aeróbica moderada y fuerza a intensidad moderada o alta, con todos los grupos musculares, 2 o más días a la semana. El plan tiene dos días de fuerza (lunes y miércoles) más taekwondo y carrera.',l:'https://pmc.ncbi.nlm.nih.gov/articles/PMC7719906/',n:'OMS · Directrices de actividad física 2020'},
 {t:'Fuerza para reducir lesiones',v:'ok',c:'Un metaanálisis de 25 ensayos asoció el entrenamiento de fuerza con menos lesiones deportivas (RR 0,32). El estiramiento por sí solo no mostró efecto (RR 0,96). Por eso el plan prioriza fuerza y usa la movilidad como complemento.',l:'https://pubmed.ncbi.nlm.nih.gov/24100287/',n:'Lauersen et al. 2014 · Br J Sports Med'},
 {t:'Fuerza y economía de carrera',v:'ok',c:'Una revisión de 24 estudios halló mejoras de la economía de carrera del 2 al 8 % con entrenamiento de fuerza, con 2–3 sesiones semanales. La evidencia es buena pero no uniforme.',l:'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5889786/',n:'Blagrove et al. 2018 · Sports Med'},
 {t:'Subidas bruscas de volumen',v:'ok',c:'En corredores noveles, subir más de un 30 % la distancia semanal en 2 semanas se asoció a más lesiones relacionadas con la distancia. La regla del 10 % es una convención y no un umbral probado. El plan sube de forma gradual y descarga cada cuarta semana. El estudio es de corredores noveles y no equivale a tu caso.',l:'https://vbn.aau.dk/da/publications/excessive-progression-in-weekly-running-distance-and-risk-of-runn',n:'Nielsen et al. 2014 · JOSPT'},
 {t:'Reducción previa a la carrera',v:'ok',c:'Un metaanálisis de 27 estudios sitúa el mejor afinado en 2 semanas, con un volumen que baja de forma exponencial un 41–60 % y sin recortar intensidad ni frecuencia. Las semanas 50–52 siguen esa pauta.',l:'https://pubmed.ncbi.nlm.nih.gov/17762369/',n:'Bosquet et al. 2007 · Med Sci Sports Exerc'},

 {t:'Estiramientos de cadera',v:'ok',c:'Los estiramientos estáticos de 30–90 s del flexor de cadera no empeoran el rendimiento, y los de 270–480 s sí lo hacen un poco. Por eso las posturas duran 30–60 s y antes de patear solo se hace movilidad dinámica. Un metaanálisis de dosis no vio beneficios extra más allá de unos 4 min por sesión o 10 min por semana. Se mantiene la práctica porque la ganancia se pierde con el tiempo si se deja.',l:'https://pubmed.ncbi.nlm.nih.gov/33671271/',n:'Metaanálisis de estiramiento del flexor de cadera'},
 {t:'Fuerza de cadera y lesiones al correr',v:'mix',c:'La evidencia es mixta: la fuerza de abductores no ha demostrado prevenir lesiones de forma consistente ni cambiar la mecánica de carrera. El bloque de cadera se incluye por su valor para las patadas, la movilidad con carga y la fuerza general de piernas, no como prevención demostrada.',l:'https://read.qxmd.com/read/27693442/hip-abductor-strength-and-lower-extremity-running-related-injury-in-distance-runners-a-systematic-review',n:'Revisión sistemática de fuerza de abductores'},

function render(){
  const v={hoy:vHoy,semana:vSemana,plan:vPlan,prog:vProg,aj:vSet}[V.tab]();const y=window.scrollY;
  document.getElementById('app').innerHTML=v;
  document.getElementById('tabs').innerHTML=TABS.map(([id,n])=>`<button data-a="tab" data-t="${id}" aria-current="${V.tab===id}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg>${n}</button>`).join('');

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function go(tab){V.tab=tab;render();window.scrollTo(0,0)}

let tmr=null;
function startTimer(s){clearInterval(tmr);let left=s;const el=document.getElementById('timer');el.hidden=false;
  const paint=()=>el.innerHTML=`<div><span class="num">Descanso ${left} s</span><button data-a="timer-stop">Parar</button></div>`;paint();
  tmr=setInterval(()=>{left--;if(left<=0){clearInterval(tmr);el.innerHTML=`<div><span>¡Siguiente serie!</span><button data-a="timer-stop">Cerrar</button></div>`;beep();setTimeout(()=>el.hidden=true,4000)}else paint()},1000)}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}}

document.addEventListener('click',e=>{

    if(window.YT&&YT.Player)make();else{const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{if(prev)prev();make()};if(!document.getElementById('ytapi')){const sc=document.createElement('script');sc.id='ytapi';sc.src='https://www.youtube.com/iframe_api';sc.onerror=plain;document.head.appendChild(sc)}setTimeout(()=>{if(!box.firstChild)plain()},6000)}
    return}
  if(a==='unlock'){const pw=(document.getElementById('pw')||{}).value||'';if(!pw.trim())return toast('Escribe la clave');
    el.disabled=true;unlockData(pw).then(o=>{const n=applyDecrypted(o,pw.trim());save();toast('Historial actualizado'+(n?` · ${n} sesiones registradas`:''));render()}).catch(()=>{el.disabled=false;toast('Clave incorrecta')});return}
  if(a==='tab')return go(el.dataset.t);
  if(a==='hday'){V.hd=+el.dataset.d;return render()}
  if(a==='open'){V.open[el.dataset.k]=!V.open[el.dataset.k];return render()}
  if(a==='wk'){V.selW=Math.min(52,Math.max(1,(V.selW||cur().w)+ +el.dataset.v));return render()}
  if(a==='gow'){V.selW=+el.dataset.w;return go('semana')}

  if(a==='set'){const k=el.dataset.k,id=el.dataset.e,i=+el.dataset.i;S.sets[k]=S.sets[k]||{};const c0=S.sets[k][id]||0;S.sets[k][id]=(c0===i+1)?i:i+1;save();return render()}
  if(a==='timer')return startTimer(+el.dataset.s);

  if(a==='unmove'){delete S.sw[el.dataset.w];save();toast('Semana restaurada');return render()}
  if(a==='wlog'){const i=document.getElementById('wl-in'),v=parseFloat(String(i&&i.value||'').replace(',','.'));if(!(v>30&&v<300))return toast('Escribe tu peso en kg');
    const d=iso(todayU());S.wlog=(S.wlog||[]).filter(x=>x[0]!==d).concat([[d,Math.round(v*10)/10]]).sort((a,b)=>a[0]<b[0]?-1:1);save();toast('Peso guardado');return render()}
  if(a==='sync')return syncStrava(true);
  if(a==='quick'){const k=el.dataset.k,[w,d]=k.split('.').map(Number),s=session(w,d);S.done[k]={t:Date.now(),km:s.km||null,rpe:null,note:''};save();toast('Registrada');return render()}
  if(a==='skipk'){S.skip[el.dataset.k]=1;save();return render()}
  if(a==='adapt-undo'){const w=el.dataset.w,pv=S.prevMult&&S.prevMult[w];if(pv===undefined)delete S.mults[w];else S.mults[w]=pv;delete S.prevMult[w];S.adaptNote.from=null;S.autoAdapt=false;save();toast('Volumen restaurado. Desactivo los ajustes automáticos de volumen; puedes reactivarlos en Más');return render()}
  if(a==='coach-apply'){S.mults[el.dataset.w]=+el.dataset.m;S.coachDone[+el.dataset.w-1]=1;save();toast('Plan ajustado');return render()}
  if(a==='coach-skip'){S.coachDone[+el.dataset.w]=1;save();return render()}
  if(a==='mult-reset'){S.mults={};save();toast('Ajustes quitados');return render()}
  if(a==='copy'){const t=document.getElementById('bk');const done=()=>toast('Copiado');
    (navigator.clipboard?navigator.clipboard.writeText(t.value).then(done):Promise.reject()).catch(()=>{t.select();toast('Selecciona y copia el texto')});return}
  if(a==='import'){try{const r=JSON.parse(document.getElementById('bk').value);if(!r||r.v!==1)throw 0;S=Object.assign({},JSON.parse(JSON.stringify(DEF)),r);if(!S.imp)S.unlocked=0;save();toast('Datos importados');render()}catch(x){toast('El texto no es una copia válida')}return}
  if(a==='reset'){V.confirmReset=true;return render()}
  if(a==='reset-no'){V.confirmReset=false;return render()}
  if(a==='reset-yes'){S=JSON.parse(JSON.stringify(DEF));save();V.confirmReset=false;toast('Datos borrados');return render()}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='import-files')return importFiles(el.files);
  if(a==='kg'){const v=el.value.trim();if(v==='')delete S.kg[el.dataset.e];else S.kg[el.dataset.e]=+v;save();return}
  if(a==='set-start'&&el.value){S.start=el.value;save();return render()}
  if(a==='move'){const w=+el.dataset.w,slot=+el.dataset.slot,to=+el.value,from=dayOfSlot(w,slot);if(to===from)return;
    const p=perm(w).slice(),other=session(w,p[to]);[p[from],p[to]]=[p[to],p[from]];S.sw=S.sw||{};if(p.join('')==='0123456')delete S.sw[w];else S.sw[w]=p;save();
    if(V.tab==='hoy')V.hd=to;toast(`Movido al ${DN[to].toLowerCase()}`+(other.kind!=='rest'?` · ${other.title} pasa al ${DN[from].toLowerCase()}`:''));return render()}
  if(a==='set-wgoal'){const v=parseFloat(el.value.replace(',','.'));if(v>40&&v<250){S.wgoal=v;save();render()}else toast('Escribe un peso objetivo en kg');return}
  if(a==='set-sync'){S.syncUrl=el.value.trim();save();return}
  if(a==='set-synckey'){S.syncKey=el.value.trim();save();return}
  if(a==='set-auto'){S.autoAdapt=el.checked;save();toast(el.checked?'Ajustes automáticos activados':'Ajustes automáticos desactivados');return}
  if(a==='set-k5'){if(/^\d{1,2}:\d{2}$/.test(el.value.trim())){S.k5=el.value.trim();save();render()}else toast('Usa el formato 26:00');return}
  if(a==='set-km'){S.startKm=+el.value;save();return render()}
  if(a==='set-goal'){if(/^\d{1,2}(:\d{2}){1,2}$/.test(el.value.trim())){S.goal=el.value.trim();save();render()}else toast('Usa el formato 4:45');return}
});
if(CFG.start&&S.mig!==CFG.start){S.mig=CFG.start;S.start=CFG.start;S.startKm=CFG.startKm||S.startKm;S.hist=CFG.hist||0;autoLog();save()}
if(!S.mig2){S.mig2=1;if(!S.k5)S.k5='26:00';if(S.goal==='4:45')S.goal='4:15';if(+S.startKm<=6)S.startKm=7;save()}
autoAdapt();applyDS();render();
if(ENC&&S.unlocked&&S.pw&&(ENC.v||'')!==(S.encV||''))unlockData(S.pw).then(o=>{const n=applyDecrypted(o,S.pw);save();render();toast(n?`Strava sincronizado · ${n} sesiones nuevas`:'Datos de Strava actualizados')}).catch(()=>{S.pw='';save();render()});
if(S.syncUrl&&Date.now()-(S.lastSync||0)>30*60e3)setTimeout(()=>syncStrava(false),800);
</script>
